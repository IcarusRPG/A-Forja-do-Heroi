name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy nunca pega o outro pela metade: o segundo espera o primeiro terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      # --ignore-scripts: o ffmpeg-static (usado só no scripts/prepare-assets.mjs) não precisa baixar o binário aqui.
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          # Endereço do PocketBase (Settings → Secrets and variables → Actions → Variables).
          VITE_PB_URL: ${{ vars.VITE_PB_URL }}
      - run: npm run test:unit
      - id: pages
        uses: actions/configure-pages@v5
      # Junta os assets do deploy anterior (até 7 dias) aos novos: quem ainda está com o index.html
      # antigo (cache de 10 min do Pages ou aba aberta) continua achando os pedaços que ele pede.
      - run: node scripts/manter-assets.mjs --dist dist --site "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
